# 临时测试：香港→毛里求斯 2026-11-01 最低价模式（全平台）
routes:
  - from: HKG
    from_name: 香港
    to: MRU
    to_name: 毛里求斯
    trip: one_way
    monitor_mode: lowest
    dates:
      - "2026-11-01"
    alert_threshold: 0

platforms:
  - ctrip
  - fliggy
  - tongcheng
  - qunar
  - tuniu

crawler:
  headless: true
  timeout_seconds: 60
  delay_min: 1
  delay_max: 2
  debug: true
  debug_dir: debug

output:
  db_path: data/test_hkg_mru.db
  log_path: logs/test_hkg_mru.log
